[project]
name = "falcon-backend"
version = "0.1.0"
description = "FALCON API — Forensic Analysis and Linked Crime Observation Network"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "av>=19.0.0",
    "en-core-web-sm",
    "fastapi>=0.142.2",
    "filetype>=1.2.0",
    "phonenumbers>=9.0.40",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.5",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "rapidocr-onnxruntime>=1.4.4",
    "spacy>=3.8.16",
    "sqlalchemy>=2",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic writes long lines in generated migrations
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
