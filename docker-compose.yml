# FALCON local infrastructure.
# Start:  docker compose up -d      Stop:  docker compose down
# Values like ${POSTGRES_USER} come from the .env file next to this one.
name: falcon

services:
  db:
    build: ./infra/postgres            # use our Dockerfile (PostGIS + pgvector)
    image: falcon-postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      # 127.0.0.1 = reachable only from THIS computer, not from your Wi-Fi network
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data                              # data survives restarts
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro         # first-run SQL scripts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
